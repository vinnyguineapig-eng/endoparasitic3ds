name: Build 3DSX
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS libraries
        run: |
          apt-get update && apt-get install -y unzip || true
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Sy --noconfirm --needed --ignore 3ds-examples --disable-download-timeout 3ds-dev && break
            echo "retry $i"; sleep 15
          done
      - name: Build
        run: |
          mkdir work && unzip -q project.zip -d work
          D=$(dirname "$(dirname "$(find work -path '*source/main.c' | head -1)")")
          cp Makefile.endo "$D/Makefile"
          cd "$D" && make
          mkdir -p "$GITHUB_WORKSPACE/out" && cp *.3dsx "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: endoparasitic-3dsx
          path: out/*.3dsx
